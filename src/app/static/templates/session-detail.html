            try {
                // Create canvas
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Set canvas size (Instagram-friendly 1080x1350)
                canvas.width = 1080;
                canvas.height = 1350;
                
                // Background gradient
                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, '#1A1A2E');
                gradient.addColorStop(1, '#16213E');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Load and draw logo
                const logo = new Image();
                logo.src = '/static/icons/logoChalkin_invertido_180.png';
                await new Promise((resolve) => {
                    logo.onload = resolve;
                });
                
                const logoSize = 100;
                ctx.drawImage(logo, 50, 50, logoSize, logoSize);
                
                // Add "Chalkin" text next to logo
                ctx.fillStyle = '#FF6B35';
                ctx.font = 'bold 60px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                ctx.fillText('Chalkin', 170, 110);
                
                // Session title
                ctx.fillStyle = 'white';
                ctx.font = 'bold 48px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                const title = session.title || session.gym_name || 'Sesión de escalada';
                ctx.fillText(title, 50, 230);
                
                // Session subtitle (if available)
                if (session.subtitle) {
                    ctx.fillStyle = '#9CA3AF';
                    ctx.font = '32px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                    ctx.fillText(session.subtitle, 50, 280);
                }
                
                // Gym name
                const yOffset = session.subtitle ? 330 : 280;
                ctx.fillStyle = '#2EC4B6';
                ctx.font = 'bold 32px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                ctx.fillText(`📍 ${session.gym_name || 'Gimnasio'}`, 50, yOffset);
                
                // Date
                const sessionDate = session.date.includes('T') ? parseUTCDate(session.date) : new Date(session.date + 'T00:00:00');
                const dateStr = sessionDate.toLocaleDateString('es', { 
                    weekday: 'long', 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                });
                ctx.fillStyle = '#9CA3AF';
                ctx.font = '32px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                ctx.fillText(dateStr, 50, yOffset + 50);
                
                // Duration
                if (session.ended_at) {
                    const duration = formatDuration(session.started_at, session.ended_at);
                    ctx.fillText(`⏱️ ${duration}`, 50, yOffset + 100);
                }
                
                // Main stats box
                const statsY = yOffset + 170;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.fillRect(50, statsY, canvas.width - 100, 200);
                
                const total = ascents.length;
                const flashes = ascents.filter(a => a.status === 'flash').length;
                const sends = ascents.filter(a => a.status === 'send' || a.status === 'flash').length;
                
                let maxGradeLabel = '-';
                let maxDifficulty = 0;
                ascents.forEach(ascent => {
                    if (ascent.status !== 'repeat' && ascent.status !== 'project') {
                        const grade = grades.find(g => g.id === ascent.grade_id);
                        if (grade && grade.relative_difficulty > maxDifficulty) {
                            maxDifficulty = grade.relative_difficulty;
                            maxGradeLabel = grade.label;
                        }
                    }
                });
                
                // Stats grid
                const stats = [
                    { label: 'Bloques', value: total, emoji: '🧗' },
                    { label: 'Flashes', value: flashes, emoji: '⚡' },
                    { label: 'Encadenados', value: sends, emoji: '✅' },
                    { label: 'Máx grado', value: maxGradeLabel, emoji: '🔥' }
                ];
                
                const statWidth = (canvas.width - 100) / 4;
                stats.forEach((stat, i) => {
                    const x = 50 + i * statWidth;
                    const centerX = x + statWidth / 2;
                    
                    // Emoji - centered
                    ctx.fillStyle = 'white';
                    ctx.font = '60px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(stat.emoji, centerX, statsY + 70);
                    
                    // Value
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 48px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(stat.value.toString(), centerX, statsY + 135);
                    
                    // Label
                    ctx.fillStyle = '#9CA3AF';
                    ctx.font = '24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(stat.label, centerX, statsY + 170);
                    
                    ctx.textAlign = 'left';
                });
                
                // Grade breakdown
                const breakdownY = statsY + 250;
                
                // Group ascents by grade
                const gradeMap = new Map();
                ascents.forEach(ascent => {
                    const gradeId = ascent.grade_id;
                    if (!gradeMap.has(gradeId)) {
                        gradeMap.set(gradeId, { flash: 0, send: 0, repeat: 0, project: 0 });
                    }
                    gradeMap.get(gradeId)[ascent.status]++;
                });
                
                // Sort grades by difficulty
                const sortedGrades = Array.from(gradeMap.entries())
                    .map(([gradeId, counts]) => {
                        const grade = grades.find(g => g.id == gradeId) || {};
                        return { grade, counts };
                    })
                    .sort((a, b) => (b.grade.relative_difficulty || 0) - (a.grade.relative_difficulty || 0))
                    .slice(0, 12); // Increased to 12 grades (6 per column)
                
                // Two column layout
                const columnWidth = (canvas.width - 100) / 2;
                const boxWidth = 200;
                const boxHeight = 110;
                const rowHeight = 130;
                
                sortedGrades.forEach(({ grade, counts }, index) => {
                    const total = counts.flash + counts.send + counts.repeat + counts.project;
                    
                    // Calculate position (two columns)
                    const column = index % 2;
                    const row = Math.floor(index / 2);
                    const xOffset = 50 + column * columnWidth;
                    const gradeY = breakdownY + row * rowHeight;
                    
                    // Grade color box
                    ctx.fillStyle = grade.color_hex || '#666';
                    ctx.fillRect(xOffset, gradeY, boxWidth, boxHeight);
                    
                    // Grade label in box
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 40px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(grade.label || '?', xOffset + boxWidth / 2, gradeY + boxHeight / 2 + 14);
                    ctx.textAlign = 'left';
                    
                    // Grade details
                    const detailsX = xOffset + boxWidth + 15;
                    const centerY = gradeY + boxHeight / 2;
                    
                    // Total blocks - centered vertically
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 36px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                    ctx.fillText(`${total} bloque${total !== 1 ? 's' : ''}`, detailsX, centerY - 10);
                    
                    // Detailed breakdown with labels - centered vertically below total
                    let details = [];
                    if (counts.flash > 0) details.push(`${counts.flash} Flash${counts.flash !== 1 ? 'es' : ''}`);
                    if (counts.send > 0) details.push(`${counts.send} Encadenado${counts.send !== 1 ? 's' : ''}`);
                    if (counts.repeat > 0) details.push(`${counts.repeat} Repetición${counts.repeat !== 1 ? 'es' : ''}`);
                    if (counts.project > 0) details.push(`${counts.project} Proyecto${counts.project !== 1 ? 's' : ''}`);
                    
                    ctx.fillStyle = '#9CA3AF';
                    ctx.font = '26px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                    ctx.fillText(details.join(' • '), detailsX, centerY + 30);
                });
                
                // Footer text
                ctx.fillStyle = '#6B7280';
                ctx.font = '24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Hecho con Chalkin', canvas.width / 2, canvas.height - 30);
                ctx.textAlign = 'left';
                
                // Convert canvas to blob and share (not download)
                canvas.toBlob(async (blob) => {
                    const file = new File([blob], 'chalkin-session.png', { type: 'image/png' });
                    const sessionUrl = window.location.href;
                    const shareText = `${title} - ${total} bloques registrados\n\nVer sesión: ${sessionUrl}`;
                    
                    btn.disabled = false;
                    btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="display: inline-block; vertical-align: middle; margin-right: 8px;"><path d="M18 8C19.6569 8 21 6.65685 21 5C21 3.34315 19.6569 2 18 2C16.3431 2 15 3.34315 15 5C15 5.12548 15.0077 5.24917 15.0227 5.37061L8.08259 9.19019C7.54305 8.46365 6.67916 8 5.7 8C3.89117 8 2.42624 9.46493 2.42624 11.274C2.42624 13.0831 3.89117 14.548 5.7 14.548C6.67916 14.548 7.54305 14.0844 8.08259 13.3578L15.0227 17.1774C15.0077 17.2988 15 17.4225 15 17.548C15 19.2049 16.3431 20.548 18 20.548C19.6569 20.548 21 19.2049 21 17.548C21 15.8911 19.6569 14.548 18 14.548C17.021 14.548 16.157 15.0116 15.6174 15.7382L8.67733 11.9186C8.69229 11.7972 8.7 11.6735 8.7 11.548C8.7 11.4225 8.69229 11.2988 8.67733 11.1774L15.6174 7.35777C16.157 8.08431 17.021 8.54793 18 8.54793V8Z" fill="currentColor"/></svg> Compartir actividad';
                    
                    // Try to share via Web Share API
                    if (navigator.share) {
                        try {
                            // Check if we can share files
                            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                                await navigator.share({
                                    files: [file],
                                    title: 'Mi sesión de escalada en Chalkin',
                                    text: shareText
                                });
                            } else {
                                // Share only text and URL
                                await navigator.share({
                                    title: 'Mi sesión de escalada en Chalkin',
                                    text: shareText
                                });
                            }
                        } catch (err) {
                            if (err.name !== 'AbortError') {
                                console.log('Error sharing:', err);
                                // Fallback: offer to download the image
                                if (confirm('No se pudo compartir. ¿Deseas descargar la imagen?')) {
                                    const url = URL.createObjectURL(blob);
                                    const a = document.createElement('a');
                                    a.href = url;
                                    a.download = `chalkin-${session.gym_name || 'sesion'}-${new Date().getTime()}.png`;
                                    a.click();
                                    URL.revokeObjectURL(url);
                                }
                            }
                        }
                    } else {
                        // Fallback for browsers without Web Share API
                        if (confirm('Tu navegador no soporta compartir. ¿Deseas descargar la imagen?')) {
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = `chalkin-${session.gym_name || 'sesion'}-${new Date().getTime()}.png`;
                            a.click();
                            URL.revokeObjectURL(url);
                        }
                    }
                }, 'image/png');
                
            } catch (error) {
                console.error('Error generating image:', error);
                btn.disabled = false;
                btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="display: inline-block; vertical-align: middle; margin-right: 8px;"><path d="M18 8C19.6569 8 21 6.65685 21 5C21 3.34315 19.6569 2 18 2C16.3431 2 15 3.34315 15 5C15 5.12548 15.0077 5.24917 15.0227 5.37061L8.08259 9.19019C7.54305 8.46365 6.67916 8 5.7 8C3.89117 8 2.42624 9.46493 2.42624 11.274C2.42624 13.0831 3.89117 14.548 5.7 14.548C6.67916 14.548 7.54305 14.0844 8.08259 13.3578L15.0227 17.1774C15.0077 17.2988 15 17.4225 15 17.548C15 19.2049 16.3431 20.548 18 20.548C19.6569 20.548 21 19.2049 21 17.548C21 15.8911 19.6569 14.548 18 14.548C17.021 14.548 16.157 15.0116 15.6174 15.7382L8.67733 11.9186C8.69229 11.7972 8.7 11.6735 8.7 11.548C8.7 11.4225 8.69229 11.2988 8.67733 11.1774L15.6174 7.35777C16.157 8.08431 17.021 8.54793 18 8.54793V8Z" fill="currentColor"/></svg> Compartir actividad';
                alert('Error al generar la imagen');

        document.getElementById('saveTitleBtn').addEventListener('click', async () => {
            const newTitle = document.getElementById('editTitleInput').value.trim() || null;
            const newSubtitle = document.getElementById('editSubtitleInput').value.trim() || null;
            
            try {
                const response = await fetchWithAuth(`${API_URL}/sessions/${sessionId}`, {
                    method: 'PATCH',
                    body: JSON.stringify({
                        title: newTitle,
                        subtitle: newSubtitle
                    })
                });
                
                if (response.ok) {
                    // Update local session data
                    session.title = newTitle;
                    session.subtitle = newSubtitle;
                    
                    // Update UI
                    const titleEl = document.getElementById('sessionTitle');
                    const gymNameEl = document.getElementById('gymName');
                    const subtitleEl = document.getElementById('sessionSubtitle');
                    
                    if (newTitle) {
                        gymNameEl.textContent = newTitle;
                    } else {
                        gymNameEl.textContent = session.gym_name || 'Sesión de escalada';
                    }
                    
                    if (newSubtitle) {
                        subtitleEl.textContent = newSubtitle;
                        subtitleEl.classList.remove('hidden');
                        subtitleEl.style.display = 'block';

                        subtitleEl.textContent = '';
                        subtitleEl.classList.add('hidden');
                        subtitleEl.style.display = 'none';

                    // Hide editor, show title
                    document.getElementById('titleEditor').classList.remove('active');
                    titleEl.style.display = 'flex';

                    alert('Error al guardar');

                console.error('Error saving title:', error);

        // ========== EXERCISES MANAGEMENT ==========
        let exercises = [];
        let selectedExerciseType = null;

        // Load exercises for the session
        async function loadExercises() {
            try {
                const response = await fetchWithAuth(`${API_URL}/sessions/${sessionId}/exercises`);
                if (!response.ok) return;
                
                exercises = await response.json();
                renderExercises();
                
                // Show add button if session is active OR in edit mode, and is own session
                const isOwnSession = session && (session.is_own !== false);
                console.log('loadExercises - isSessionEnded:', isSessionEnded, 'isEditMode:', isEditMode, 'isOwnSession:', isOwnSession);
                
                if ((!isSessionEnded || isEditMode) && isOwnSession) {
                    document.getElementById('addExerciseBtn').style.display = 'inline-flex';
                }
            } catch (error) {
                console.error('Error loading exercises:', error);
            }
        }

        function renderExercises() {
            const container = document.getElementById('exercisesList');
            
            if (exercises.length === 0) {
                container.innerHTML = '<div class="empty-exercises">No hay ejercicios registrados</div>';

                'campus': '<svg viewBox="0 0 24 24" fill="#4A5568" style="width:20px;height:20px;vertical-align:middle;margin-right:6px;"><path d="M14 6l-3.75 5 2.85 3.8-1.6 1.2C9.81 13.75 7 10 7 10l-6 8h22L14 6z"/></svg>',
                'fingerboard': '<svg viewBox="0 0 24 24" fill="#4A5568" style="width:20px;height:20px;vertical-align:middle;margin-right:6px;"><path d="M23 5.5V20c0 2.2-1.8 4-4 4h-7.3c-1.08 0-2.1-.43-2.85-1.19L1 14.83s1.26-1.23 1.3-1.25c.22-.19.49-.29.79-.29.22 0 .42.06.6.16.04.01 4.31 2.46 4.31 2.46V4c0-.83.67-1.5 1.5-1.5S11 3.17 11 4v7h1V1.5c0-.83.67-1.5 1.5-1.5S15 .67 15 1.5V11h1V2.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5V11h1V5.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5z"/></svg>',
                'other': '<svg viewBox="0 0 24 24" fill="#4A5568" style="width:20px;height:20px;vertical-align:middle;margin-right:6px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>',
                'block': '<svg viewBox="0 0 24 24" fill="#4A5568" style="width:20px;height:20px;vertical-align:middle;margin-right:6px;"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>'
            };
            
            container.innerHTML = exercises.map(ex => {
                const icon = exerciseIcons[ex.exercise_type] || '<svg viewBox="0 0 24 24" fill="#4A5568" style="width:20px;height:20px;vertical-align:middle;margin-right:6px;"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29z"/></svg>';
                const typeName = {
                    'pullups': 'Dominadas',
                    'campus': 'Campus',
                    'fingerboard': 'Fingerboard',
                    'block': 'Levantamiento'
                }[ex.exercise_type] || ex.exercise_type;
                
                let details = [];
                if (ex.sets) details.push(`${ex.sets} series`);
                if (ex.reps) details.push(`${ex.reps} reps`);
                if (ex.weight) details.push(`${ex.weight} kg`);
                if (ex.protocol) details.push(ex.protocol);
                if (ex.edge_depth_mm) details.push(`${ex.edge_depth_mm} mm`);
                if (ex.hand) details.push({ left: 'izq', right: 'der', both: 'ambas' }[ex.hand] || ex.hand);
                if (ex.grip) details.push('agarre ' + ({ open: 'abierta', half_crimp: 'semicrimp', full_crimp: 'crimp', pinch: 'pinza', mono: 'mono', two_finger: '2 dedos', other: 'otra' }[ex.grip] || ex.grip));
                if (ex.added_weight_kg) details.push(`+${ex.added_weight_kg} kg`);

                // Chalkin Sense reps, shown individually and grouped by set
                const reps = ex.sense_reps || [];

                if (reps.length) {

                        (bySet[s] = bySet[s] || []).push(r);

                    const fmt = v => (v == null ? '—' : Number(v).toFixed(1));

        // ===== Chalkin Sense recording =====
        let senseClient = null;
        let senseReps = [];
        let senseSetIndex = 1;
        let senseRepInSet = 0;
        let sensePull = null;
        let senseConnected = false;

        // Para levantamiento: el peso se toma del sensor si hay conexión;
        // si no, se permite escribirlo a mano.
        function updateExerciseWeightField() {
            if (selectedExerciseType !== 'block') return;
            const weightInput = document.getElementById('exerciseWeight');
            if (!weightInput) return;
            if (senseConnected) {
                const peaks = senseReps.map(r => r.peak_force_kg).filter(v => v != null);
                weightInput.value = peaks.length ? Math.max(...peaks).toFixed(1) : '';
                weightInput.disabled = true;
            } else {
                weightInput.disabled = false;
            }
        }

        function renderSenseReps() {
            document.getElementById('senseRepCount').textContent = String(senseRepInSet);
            document.getElementById('senseSetLabel').textContent = String(senseSetIndex);
            const list = document.getElementById('senseRepsList');
            if (!senseReps.length) { list.innerHTML = ''; return; }
            list.innerHTML = senseReps.map((r) => `
                <div class="rep-row">
                    <span>Serie ${r.set_index} · rep ${r.rep_index}</span>
                    <span>${r.peak_force_kg != null ? r.peak_force_kg.toFixed(1) + ' kg' : '—'}
                        · RFD ${r.rfd_kg_s != null ? Math.round(r.rfd_kg_s) : '—'}
                        · TUT ${r.tut_s != null ? r.tut_s.toFixed(1) + ' s' : '—'}</span>
                </div>
            `).join('');
        }

        async function connectSense() {
            const statusEl = document.getElementById('senseStatus');
            try {
                const sdk = await import('/static/sdk/js/index.js');
                senseClient = new sdk.SenseClient();

                senseClient.addEventListener(sdk.SenseEvent.STATUS, (e) => {
                    const on = e.detail.connected;
                    senseConnected = on;
                    statusEl.textContent = on ? 'Conectado' : 'Desconectado';
                    statusEl.className = on ? 'on' : '';
                    document.getElementById('senseLive').style.display = on ? 'flex' : 'none';
                    document.getElementById('senseConnectBtn').textContent =
                        on ? '<svg viewBox="0 0 24 24" fill="currentColor" style="width:16px;height:16px;vertical-align:middle;margin-right:4px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 16c-3.31 0-6-2.69-6-6h2c0 2.21 1.79 4 4 4s4-1.79 4-4h2c0 3.31-2.69 6-6 6zm0-12c-3.31 0-6 2.69-6 6h2c0-2.21 1.79-4 4-4s4 1.79 4 4h2c0-3.31-2.69-6-6-6z"/></svg>Reconectar' : '<svg viewBox="0 0 24 24" fill="currentColor" style="width:16px;height:16px;vertical-align:middle;margin-right:4px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 16c-3.31 0-6-2.69-6-6h2c0 2.21 1.79 4 4 4s4-1.79 4-4h2c0 3.31-2.69 6-6 6zm0-12c-3.31 0-6 2.69-6 6h2c0-2.21 1.79-4 4-4s4 1.79 4 4h2c0-3.31-2.69-6-6-6z"/></svg>Conectar Chalkin Sense';
                    updateExerciseWeightField();
                });

                senseClient.addEventListener(sdk.SenseEvent.SAMPLE, (e) => {
                    const kg = e.detail.kg;
                    document.getElementById('senseForce').textContent = kg.toFixed(1);
                    if (!sensePull && kg > 2.0) sensePull = { sum: 0, count: 0 };
                    if (sensePull && kg > 1.0) { sensePull.sum += kg; sensePull.count += 1; }
                });

                senseClient.addEventListener(sdk.SenseEvent.PULL_END, (e) => {
                    const p = e.detail;
                    const mean = sensePull && sensePull.count ? sensePull.sum / sensePull.count : null;
                    sensePull = null;
                    senseRepInSet += 1;
                    senseReps.push({
                        set_index: senseSetIndex,
                        rep_index: senseRepInSet,
                        peak_force_kg: p.peakKg,
                        mean_force_kg: mean,
                        rfd_kg_s: p.rfdKgS,
                        tut_s: p.tutS,
                        duration_s: p.durationS,
                        source: 'sense',
                    });
                    renderSenseReps();
                    updateExerciseWeightField();
                });

                senseClient.addEventListener(sdk.SenseEvent.ERROR, (e) => {
                    statusEl.textContent = 'Error: ' + e.detail.error.message;
                });

                await senseClient.connect();
            } catch (err) {
                statusEl.textContent = 'Error: ' + err.message;
            }
        }

        document.getElementById('senseConnectBtn')?.addEventListener('click', connectSense);

        document.getElementById('senseNewSetBtn')?.addEventListener('click', () => {
            if (senseRepInSet > 0) {
                senseSetIndex += 1;
                senseRepInSet = 0;
                renderSenseReps();
            }
        });

        document.getElementById('senseClearBtn')?.addEventListener('click', () => {
            if (!senseReps.length || !confirm('¿Borrar las reps grabadas?')) return;
            senseReps = [];
            senseSetIndex = 1;
            senseRepInSet = 0;
            renderSenseReps();
        });

        function resetSense() {
            if (senseClient && senseClient.isConnected) senseClient.disconnect();
            senseClient = null;
            senseReps = [];
            senseSetIndex = 1;
            senseRepInSet = 0;
            sensePull = null;
            senseConnected = false;
            const weightInput = document.getElementById('exerciseWeight');
            if (weightInput) weightInput.disabled = false;
            const live = document.getElementById('senseLive');
            if (live) live.style.display = 'none';
            const statusEl = document.getElementById('senseStatus');
            if (statusEl) { statusEl.textContent = 'Desconectado'; statusEl.className = ''; }
            const btn = document.getElementById('senseConnectBtn');
            if (btn) btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" style="width:16px;height:16px;vertical-align:middle;margin-right:4px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 16c-3.31 0-6-2.69-6-6h2c0 2.21 1.79 4 4 4s4-1.79 4-4h2c0 3.31-2.69 6-6 6zm0-12c-3.31 0-6 2.69-6 6h2c0-2.21 1.79-4 4-4s4 1.79 4 4h2c0-3.31-2.69-6-6-6z"/></svg>Conectar Chalkin Sense';
            const list = document.getElementById('senseRepsList');
            if (list) list.innerHTML = '';
        }

        async function saveExercise() {
            if (!selectedExerciseType) {
                alert('Selecciona un tipo de ejercicio');
                return;
            }
            
            let exerciseType = selectedExerciseType;
            if (selectedExerciseType === 'other') {
                exerciseType = document.getElementById('exerciseTypeInput').value.trim();
                if (!exerciseType) {
                    alert('Especifica el tipo de ejercicio');
                    return;
                }
            }
            
            const data = {
                exercise_type: exerciseType,
                sets: parseInt(document.getElementById('exerciseSets').value) || null,
                reps: document.getElementById('exerciseReps').value.trim() || null,
                weight: parseFloat(document.getElementById('exerciseWeight').value) || null,
                notes: document.getElementById('exerciseNotes').value.trim() || null,
                protocol: document.getElementById('exerciseProtocol').value.trim() || null,
                edge_depth_mm: parseInt(document.getElementById('exerciseEdge').value) || null,
                hand: document.getElementById('exerciseHand').value || null,
                grip: document.getElementById('exerciseGrip').value || null,
                added_weight_kg: parseFloat(document.getElementById('exerciseAddedWeight').value) || null
            };
            
            try {
                const response = await fetchWithAuth(`${API_URL}/sessions/${sessionId}/exercises`, {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    const exercise = await response.json();
                    // Save any reps captured with Chalkin Sense
                    if (senseReps.length) {
                        await fetchWithAuth(`${API_URL}/sessions/exercises/${exercise.id}/reps`, {
                            method: 'POST',
                            body: JSON.stringify(senseReps)
                        });
                    }
                    resetSense();
                    cancelExerciseForm();
                    await loadExercises();
                } else {
                    alert('Error al guardar ejercicio');
                }
            } catch (error) {
                console.error('Error saving exercise:', error);
                alert('Error al guardar ejercicio');
            }
        }

        async function deleteExercise(exerciseId) {
            if (!confirm('¿Eliminar este ejercicio?')) return;
            
            try {
                const response = await fetchWithAuth(`${API_URL}/sessions/exercises/${exerciseId}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    await loadExercises();
                } else {
                    alert('Error al eliminar ejercicio');
                }
            } catch (error) {
                console.error('Error deleting exercise:', error);
                alert('Error al eliminar ejercicio');
            }
        }

        loadSession();
    </script>
</body>
</html>
