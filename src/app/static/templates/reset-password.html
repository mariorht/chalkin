<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña - Chalkin</title>
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/logoChalkin_invertido_16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/logoChalkin_invertido_32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/logoChalkin_invertido_180.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF6B35">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #2EC4B6;
            --dark: #1A1A2E;
            --light: #F7F7F7;
            --gray: #6B7280;
            --error: #EF4444;
            --success: #22C55E;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, #16213E 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .auth-card {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .auth-card h1 {
            color: var(--dark);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .auth-card .subtitle {
            color: var(--gray);
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-group { margin-bottom: 1.5rem; }

        .form-group label {
            display: block;
            color: var(--dark);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 2px solid #E5E7EB;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .form-hint {
            font-size: 0.8rem;
            color: var(--gray);
            margin-top: 0.3rem;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .btn-primary:disabled { background: var(--gray); cursor: not-allowed; transform: none; }

        .alert {
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            display: none;
        }

        .alert-error { background: rgba(239, 68, 68, 0.1); color: var(--error); border: 1px solid var(--error); }
        .alert-success { background: rgba(34, 197, 94, 0.1); color: var(--success); border: 1px solid var(--success); }
        .alert.show { display: block; }

        .auth-link { text-align: center; color: var(--gray); margin-top: 1.5rem; }
        .auth-link a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .auth-link a:hover { text-decoration: underline; }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) { .auth-card { padding: 2rem; } }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo"><span>🧗</span> Chalkin</a>
    </header>

    <main class="main-container">
        <div class="auth-card">
            <h1>Nueva contraseña</h1>
            <p class="subtitle">Elige una contraseña nueva para tu cuenta</p>

            <div id="alert" class="alert"></div>

            <form id="resetForm">
                <div class="form-group">
                    <label for="password">Nueva contraseña</label>
                    <input type="password" id="password" name="password" required minlength="6" placeholder="••••••••">
                    <p class="form-hint">Mínimo 6 caracteres</p>
                </div>

                <div class="form-group">
                    <label for="confirm">Repite la contraseña</label>
                    <input type="password" id="confirm" name="confirm" required minlength="6" placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">Guardar contraseña</button>
            </form>

            <p class="auth-link"><a href="/login">Volver al inicio de sesión</a></p>
        </div>
    </main>

    <script>
        const API_URL = '/api';
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        const form = document.getElementById('resetForm');
        const alert = document.getElementById('alert');
        const submitBtn = document.getElementById('submitBtn');

        function showAlert(message, type = 'error') {
            alert.textContent = message;
            alert.className = `alert alert-${type} show`;
        }

        function setLoading(loading) {
            if (loading) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner"></span>Guardando...';
            } else {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Guardar contraseña';
            }
        }

        if (!token) {
            showAlert('Este enlace no es válido. Pide uno nuevo al administrador.');
            form.style.display = 'none';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;

            if (password !== confirm) {
                showAlert('Las contraseñas no coinciden');
                return;
            }
            if (password.length < 6) {
                showAlert('La contraseña debe tener al menos 6 caracteres');
                return;
            }

            setLoading(true);
            alert.className = 'alert';

            try {
                const response = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: password }),
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('¡Contraseña actualizada! Redirigiendo al inicio de sesión...', 'success');
                    form.style.display = 'none';
                    setTimeout(() => { window.location.href = '/login'; }, 2000);
                } else {
                    showAlert(data.detail || 'No se pudo restablecer la contraseña');
                }
            } catch (error) {
                showAlert('Error de conexión. Intenta de nuevo.');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
