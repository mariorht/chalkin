<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigos - Chalkin</title>
    
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/logoChalkin_invertido_16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/logoChalkin_invertido_32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/logoChalkin_invertido_180.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF6B35">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Chalkin">
    
    <link rel="stylesheet" href="/static/css/app-shell.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--light);
        }
        /* Header styles in app-shell.css */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1, h2 {
            color: #333;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 1.2rem;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-box input {
            flex: 1;
            min-width: 0;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }
        .search-box button {
            padding: 12px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .search-box button:hover {
            transform: scale(1.02);
        }
        .search-results, .friend-list, .requests-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            max-height: 300px;
            overflow-y: auto;
            z-index: 100;
        }
        .search-wrapper {
            position: relative;
        }
        .user-item, .friend-item, .request-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .user-item:hover, .friend-item:hover, .request-item:hover {
            background: #e9ecef;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            overflow: hidden;
            flex-shrink: 0;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .username {
            font-weight: 600;
            color: #333;
        }
        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            border: none;
            transition: transform 0.2s;
            white-space: nowrap;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #667eea;
            color: #667eea;
        }
        .actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .empty-state {
            text-align: center;
            padding: 30px;
            color: #666;
        }
        .empty-state span {
            font-size: 2rem;
            display: block;
            margin-bottom: 10px;
        }
        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-pending {
            background: #fff3cd;
            color: #856404;
        }
        .badge-friends {
            background: #d4edda;
            color: #155724;
        }
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #667eea;
            background: transparent;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .request-count {
            background: #dc3545;
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 0.75rem;
            margin-left: 5px;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        .load-more-btn {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: none;
            border-top: 1px solid #e9ecef;
            color: #667eea;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .load-more-btn:hover {
            background: #f8f9fa;
        }
    </style>
    <link rel="stylesheet" href="/static/css/flat.css">
</head>
<body class="has-app-shell">
    <div class="container">
        <div class="card">
            <!-- Search -->
            <div class="search-wrapper">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Buscar usuarios..." autocomplete="off">
                </div>
                <div id="searchResults" class="search-results" style="display:none;"></div>
            </div>
        </div>

        <div class="card">
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="showTab('friends')">
                    Mis Amigos
                </button>
                <button class="tab-btn" onclick="showTab('requests')" id="requestsTabBtn">
                    Solicitudes
                </button>
            </div>

            <div id="friendsTab" class="tab-content active">
                <div id="friendsList" class="friend-list">
                    <div class="loading">Cargando...</div>
                </div>
            </div>

            <div id="requestsTab" class="tab-content">
                <div id="requestsList" class="requests-list">
                    <div class="loading">Cargando...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/icons.js"></script>
    <script src="/static/js/app-shell.js"></script>
    <script>
        // Inicializar App Shell
        AppShell.init({ activePage: 'friends' });
        
        const API_URL = '/api';
        let token = AppShell.token;
        let searchTimeout = null;
        let suggestionsSkip = 0;
        let suggestionsHasMore = false;

        function parseUTCDate(dateStr) {
            if (!dateStr) return null;
            if (dateStr.endsWith('Z') || dateStr.includes('+')) {
                return new Date(dateStr);
            }
            return new Date(dateStr + 'Z');
        }

        function getHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };
        }

        // Búsqueda en tiempo real
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.trim();
            const resultsDiv = document.getElementById('searchResults');
            
            // Clear previous timeout
            if (searchTimeout) clearTimeout(searchTimeout);
            
            suggestionsSkip = 0;
            
            // Hide if less than 1 char
            if (query.length < 1) {
                resultsDiv.style.display = 'none';
                return;
            }
            
            // Debounce: wait 200ms after typing stops
            searchTimeout = setTimeout(() => searchUsers(query), 200);
        });

        // Mostrar usuarios al hacer foco si el campo está vacío
        document.getElementById('searchInput').addEventListener('focus', function(e) {
            const query = e.target.value.trim();
            const resultsDiv = document.getElementById('searchResults');
            
            if (query.length === 0) {
                suggestionsSkip = 0;
                searchUsers('');
            }
        });

        // Hide results when clicking outside
        document.addEventListener('click', function(e) {
            const searchWrapper = document.querySelector('.search-wrapper');
            if (!searchWrapper.contains(e.target)) {
                document.getElementById('searchResults').style.display = 'none';
            }
        });

        function showTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if (tab === 'friends') {
                document.querySelector('.tab-btn:first-child').classList.add('active');
                document.getElementById('friendsTab').classList.add('active');
            } else {
                document.getElementById('requestsTabBtn').classList.add('active');
                document.getElementById('requestsTab').classList.add('active');
            }
        }

        function renderAvatar(user) {
            if (user.profile_picture) {
                return `<img src="${escapeHtml(user.profile_picture)}" alt="${escapeHtml(user.username)}">`;
            }
            return escapeHtml(user.username.charAt(0).toUpperCase());
        }

        async function searchUsers(query, loadMore = false) {
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.style.display = 'block';
            
            if (!loadMore) {
                resultsDiv.innerHTML = '<div class="loading">Buscando...</div>';
                suggestionsSkip = 0;
            }

            try {
                let url;
                if (query && query.length > 0) {
                    url = `${API_URL}/social/search?q=${encodeURIComponent(query)}`;
                } else {
                    url = `${API_URL}/social/search/suggestions?skip=${suggestionsSkip}`;
                }
                
                const res = await fetch(url, {
                    headers: getHeaders()
                });

                if (res.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                const data = await res.json();
                
                let users, hasMore;
                if (query && query.length > 0) {
                    users = data;
                    hasMore = false;
                } else {
                    users = data.users;
                    hasMore = data.has_more;
                    suggestionsHasMore = hasMore;
                }

                if (users.length === 0 && !loadMore) {
                    resultsDiv.innerHTML = '<div class="empty-state"><span><svg viewBox="0 0 24 24" fill="currentColor" style="width:48px;height:48px;"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span>No se encontraron usuarios</div>';
                    return;
                }

                const label = query && query.length > 0 ? 'Resultados' : 'Sugerencias';
                
                const usersHtml = users.map(user => `
                    <div class="user-item" onclick="goToProfile(${user.id}, event)">
                        <div class="user-info">
                            <div class="avatar">${renderAvatar(user)}</div>
                            <span class="username">${escapeHtml(user.username)}</span>
                            ${user.friendship_status ? `
                                <span class="status-badge ${user.friendship_status === 'accepted' ? 'badge-friends' : 'badge-pending'}">
                                    ${getStatusLabel(user.friendship_status)}
                                </span>
                            ` : ''}
                        </div>
                        ${renderSearchActions(user)}
                    </div>
                `).join('');
                
                const loadMoreHtml = hasMore ? `
                    <button class="load-more-btn" onclick="loadMoreSuggestions()">
                        Ver más
                    </button>
                ` : '';
                
                if (loadMore) {
                    const existingItems = resultsDiv.querySelectorAll('.user-item');
                    const lastItem = existingItems[existingItems.length - 1];
                    lastItem.insertAdjacentHTML('afterend', usersHtml + loadMoreHtml);
                    const loadMoreBtn = resultsDiv.querySelector('.load-more-btn');
                    if (loadMoreBtn && loadMoreBtn.previousElementSibling !== lastItem) {
                        loadMoreBtn.remove();
                    }
                } else {
                    resultsDiv.innerHTML = `
                        <div style="padding: 8px 16px; font-size: 0.75rem; color: #666; font-weight: 600; text-transform: uppercase;">
                            ${label}
                        </div>
                        ${usersHtml}
                        ${loadMoreHtml}
                    `;
                }
            } catch (err) {
                resultsDiv.innerHTML = '<div class="empty-state"><span><svg viewBox="0 0 24 24" fill="#EF4444" style="width:48px;height:48px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></span>Error al buscar</div>';
            }
        }

        function loadMoreSuggestions() {
            suggestionsSkip += 10;
            searchUsers('', true);
        }

        function getStatusLabel(status) {
            switch(status) {
                case 'accepted': return 'Amigos';
                case 'pending': return 'Solicitud enviada';
                case 'pending_received': return 'Te envió solicitud';
                default: return '';
            }
        }

        function renderSearchActions(user) {
            if (!user.friendship_status) {
                return `<button class="btn btn-primary" onclick="sendRequest(${user.id}, event)"><svg viewBox="0 0 24 24" fill="currentColor" style="width:16px;height:16px;vertical-align:middle;margin-right:4px;"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Añadir</button>`;
            }
            if (user.friendship_status === 'pending_received') {
                return `<button class="btn btn-success" onclick="acceptFromSearch(${user.id}, event)"><svg viewBox="0 0 24 24" fill="currentColor" style="width:16px;height:16px;vertical-align:middle;margin-right:4px;"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>Aceptar</button>`;
            }
            return '';
        }

        async function sendRequest(friendId, event) {
            if (event) event.stopPropagation();
            try {
                const res = await fetch(`${API_URL}/social/friends`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ friend_id: friendId })
                });

                if (res.ok) {
                    const query = document.getElementById('searchInput').value.trim();
                    if (query.length >= 2) searchUsers(query);
                    loadFriends();
                } else {
                    const data = await res.json();
                    alert(data.detail || 'Error al enviar solicitud');
                }
            } catch (err) {
                alert('Error de conexión');
            }
        }

        async function acceptFromSearch(userId, event) {
            if (event) event.stopPropagation();
            // First we need to find the request ID
            const res = await fetch(`${API_URL}/social/friends/requests`, {
                headers: getHeaders()
            });
            const requests = await res.json();
            const request = requests.find(r => r.user_id === userId);
            if (request) {
                await acceptRequest(request.id);
                const query = document.getElementById('searchInput').value.trim();
                if (query.length >= 2) searchUsers(query);
            }
        }

        async function loadFriends() {
            const container = document.getElementById('friendsList');
            
            try {
                const res = await fetch(`${API_URL}/social/friends`, {
                    headers: getHeaders()
                });

                if (res.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                const friends = await res.json();

                if (friends.length === 0) {
                    container.innerHTML = '<div class="empty-state"><span><svg viewBox="0 0 24 24" fill="currentColor" style="width:48px;height:48px;"><path d="M23 5.5V20c0 2.2-1.8 4-4 4h-7.3c-2.3 0-4.5-.9-6.2-2.5L.7 17l1.4-1.4L7.4 20c.6.5 1.3.8 2.1.9V4h1.7c1 0 1.8.8 1.8 1.8V12h1.7V2.6c0-1 .8-1.8 1.8-1.8h.3c1 0 1.8.8 1.8 1.8V12h1.7V4.6c0-1 .8-1.8 1.8-1.8h.3c1 0 1.8.8 1.8 1.8V12z"/></svg></span>Aún no tienes amigos. ¡Busca usuarios para añadir!</div>';
                    return;
                }

                container.innerHTML = friends.map(friend => `
                    <div class="friend-item" onclick="goToProfile(${friend.id}, event)">
                        <div class="user-info">
                            <div class="avatar">${renderAvatar(friend)}</div>
                            <div>
                                <span class="username">${escapeHtml(friend.username)}</span>
                                <div style="font-size: 0.8rem; color: #666;">
                                    Amigos desde ${parseUTCDate(friend.since).toLocaleDateString('es-ES')}
                                </div>
                            </div>
                        </div>
                        <button class="btn btn-danger" onclick="removeFriend(${friend.id}, event)">
                            Eliminar
                        </button>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = '<div class="empty-state"><span><svg viewBox="0 0 24 24" fill="#EF4444" style="width:48px;height:48px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></span>Error al cargar amigos</div>';
            }
        }

        async function loadRequests() {
            const container = document.getElementById('requestsList');
            const tabBtn = document.getElementById('requestsTabBtn');
            
            try {
                const res = await fetch(`${API_URL}/social/friends/requests`, {
                    headers: getHeaders()
                });

                const requests = await res.json();

                // Update tab button with count
                if (requests.length > 0) {
                    tabBtn.innerHTML = `Solicitudes <span class="request-count">${requests.length}</span>`;
                } else {
                    tabBtn.innerHTML = 'Solicitudes';
                }

                if (requests.length === 0) {
                    container.innerHTML = '<div class="empty-state"><span><svg viewBox="0 0 24 24" fill="currentColor" style="width:48px;height:48px;"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 12h-4c0 1.66-1.35 3-3 3s-3-1.34-3-3H5V5h14v10z"/></svg></span>No tienes solicitudes pendientes</div>';
                    return;
                }

                container.innerHTML = requests.map(req => `
                    <div class="request-item" onclick="goToProfile(${req.user_id}, event)">
                        <div class="user-info">
                            <div class="avatar">${renderAvatar({ username: req.user_username, profile_picture: req.user_profile_picture })}</div>
                            <div>
                                <span class="username">${escapeHtml(req.user_username)}</span>
                                <div style="font-size: 0.8rem; color: #666;">
                                    ${parseUTCDate(req.created_at).toLocaleDateString('es-ES')}
                                </div>
                            </div>
                        </div>
                        <div class="actions">
                            <button class="btn btn-success" onclick="acceptRequest(${req.id}, event)"><svg viewBox="0 0 24 24" fill="currentColor" style="width:16px;height:16px;vertical-align:middle;margin-right:4px;"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>Aceptar</button>
                            <button class="btn btn-danger" onclick="rejectRequest(${req.id}, event)"><svg viewBox="0 0 24 24" fill="currentColor" style="width:16px;height:16px;vertical-align:middle;margin-right:4px;"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>Rechazar</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = '<div class="empty-state"><span><svg viewBox="0 0 24 24" fill="#EF4444" style="width:48px;height:48px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></span>Error al cargar solicitudes</div>';
            }
        }

        async function acceptRequest(requestId, event) {
            if (event) event.stopPropagation();
            try {
                const res = await fetch(`${API_URL}/social/friends/requests/${requestId}/accept`, {
                    method: 'POST',
                    headers: getHeaders()
                });

                if (res.ok) {
                    loadFriends();
                    loadRequests();
                } else {
                    alert('Error al aceptar solicitud');
                }
            } catch (err) {
                alert('Error de conexión');
            }
        }

        async function rejectRequest(requestId, event) {
            if (event) event.stopPropagation();
            if (!confirm('¿Rechazar esta solicitud de amistad?')) return;
            
            try {
                const res = await fetch(`${API_URL}/social/friends/requests/${requestId}/reject`, {
                    method: 'POST',
                    headers: getHeaders()
                });

                if (res.ok) {
                    loadRequests();
                } else {
                    alert('Error al rechazar solicitud');
                }
            } catch (err) {
                alert('Error de conexión');
            }
        }

        function goToProfile(userId, event) {
            if (event) event.stopPropagation();
            window.location.href = `/users?id=${userId}`;
        }

        async function removeFriend(friendId, event) {
            if (event) event.stopPropagation();
            if (!confirm('¿Eliminar a este usuario de tus amigos?')) return;
            
            try {
                const res = await fetch(`${API_URL}/social/friends/${friendId}`, {
                    method: 'DELETE',
                    headers: getHeaders()
                });

                if (res.ok) {
                    loadFriends();
                } else {
                    alert('Error al eliminar amigo');
                }
            } catch (err) {
                alert('Error de conexión');
            }
        }

        // Initial load
        loadFriends();
        loadRequests();
    </script>
</body>
</html>
